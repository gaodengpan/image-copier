name: ImageCopierV2
run-name: copy ${{inputs.imageId}} to ${{inputs.destImageId}}${{inputs.suffix}}
on:
  workflow_dispatch:
    inputs:
      imageId:
        description: 'source image'
        type: string
        required: true
      destImageId:
        description: 'target image address'
        type: string
        required: true
      suffix:
        description: 'name suffix to distinguish run-name'
        type: string
        required: false
      arch:
        description: 'image arch'
        type: string
        required: false
        default: 'arm64'
      os:
        description: 'image os'
        type: string
        required: false
        default: 'linux'
        

defaults:
  run:
    shell: bash

jobs:
  copy:
    name: copy
    runs-on: ubuntu-latest
    container:
      image: ananace/skopeo:latest
    steps:
      - name: copy
        run: skopeo copy --override-arch ${{inputs.arch}} --override-os ${{inputs.os}} docker://${{inputs.imageId}} docker://${{inputs.destImageId}} --dest-creds ${{secrets.DEST_CREDS}} 