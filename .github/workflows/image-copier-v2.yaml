name: ImageCopierV2
run-name: copy ${{inputs.imageId}} to ${{inputs.destImageId}}${{inputs.suffix}}
on:
  workflow_dispatch:
    inputs:
      imageId:
        description: 'source image'
        type: string
        required: true
      destImageId:
        description: 'target image address'
        type: string
        required: true
      suffix:
        description: 'name suffix to distinguish run-name'
        type: string
        required: false

defaults:
  run:
    shell: bash

jobs:
  copy:
    name: copy
    runs-on: ubuntu-latest
    steps:
      - name: install
        run: sudo apt-get update && sudo apt-get -y install skopeo
      - name: copy
        run: skopeo copy docker://docker.io/${{inputs.imageId}} docker://${{inputs.destImageId}} --dest-creds ${{secrets.DEST_CREDS}}