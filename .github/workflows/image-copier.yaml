name: ImageCopier
run-name: Copy Images by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      images:
        description: 'image to be copied, multiple images must be separated with commas'
        type: string
        required: true

defaults:
  run:
    shell: bash

jobs:
  ParseArgs:
    name: ParseArgs
    runs-on: ubuntu-latest
    steps:
      - id: step1
        name: build matrix
        run: echo "[${{inputs.images}}]" >> "$GITHUB_OUTPUT"
    outputs:
      imageIds: ${{steps.step1.outputs}}
  SyncImage:
    name: SyncImage
    runs-on: ubuntu-latest
    needs: ParseArgs
    strategy:
      matrix:
        imageId: ${{jobs.ParseArgs.outputs.imageIds}}
    steps:
      - name: echo
        run: echo ${{ matrix.imageId }}