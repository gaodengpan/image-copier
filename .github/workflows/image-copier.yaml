name: ImageCopier
run-name: Copy Images by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      images:
        description: 'image to be copied, multiple images must be separated with commas'
        type: string
        required: true

defaults:
  run:
    shell: bash

jobs:
  pre_matrix:
    name: pre_matrix
    runs-on: ubuntu-latest
    steps:
      - id: step1
        name: build matrix
        run: echo "${{inputs.images}}]" | sed 's/,/","/g;s/^/\["/;s/$/"\]/' | sed 's/^/imageIds=/'  >> "$GITHUB_OUTPUT"
    outputs:
      imageIds: ${{steps.step1.outputs.imageIds}}
  sync_image:
    name: sync_image
    runs-on: ubuntu-latest
    needs: pre_matrix
    strategy:
      matrix:
        image: ${{fromJson( needs.pre_matrix.outputs.imageIds )}} 
    env:
      IMAGE_ID: ${{ matrix.image }}
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST}}
      REGSITRY_NAMESPACE: ${{ vars.REGSITRY_NAMESPACE}}
      REGISTRY_USERNAME: ${{secrets.REGISTRY_USERNAME}}
      REGISTRY_PASSWORD: ${{secrets.REGISTRY_PASSWORD}}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: pull
        run: docker pull ${{env.IMAGE_ID}}
      - id: tag
        name: tag
        run: |
          TARGET_IMAGE
          if [ -z "${{env.REGSITRY_NAMESPACE}}" ]; then
            TARGET_IMAGE=${{env.REGISTRY_HOST}}/$(echo ${{env.IMAGE_ID}} | cut -d'/' -f2,3)
          else
            TARGET_IMAGE=${{env.REGISTRY_HOST}}/${{env.REGSITRY_NAMESPACE}}/$(echo ${{env.IMAGE_ID}} | awk -F'/' '{pring $NF}')
          fi
          echo "source=${{env.IMAGE_ID}}, target=$TARGET_IMAGE"
          docker tag ${{env.IMAGE_ID}} $TARGET_IAMGE
          echo "target=$TARGET_IMAGE" >> "$GITHUB_OUTPUT"
      - name: login registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: push
        run: docker push ${{steps.tag.outputs.target}}
      